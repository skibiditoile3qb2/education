<!DOCTYPE html>
<html lang="eng">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>An educational website</title>

  
</head>
<body>
  <div class="container">
    <h1>Educational things</h1>
    <p>Exps. to help you in school.</p>
  </div>
  <script>
    //hello skids
    //about:blank is invis.
    //original tab becomes google
    if (window.location.href !== 'about:blank') {
    const file = document.documentElement.outerHTML;
    const newTab = window.open('about:blank');
    newTab.document.write(file);
    newTab.document.close();
    window.location.href = 'https://google.com';
    }
  </script>
</body>
